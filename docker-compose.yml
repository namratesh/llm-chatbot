services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - chatbot-data:/app/data
    networks:
      - chatbot-network

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "8501:8501"
    environment:
      - FASTAPI_ENDPOINT=http://api:8000/v1/chat/stream
    depends_on:
      - api
    networks:
      - chatbot-network

volumes:
  chatbot-data:

networks:
  chatbot-network:
    driver: bridge
